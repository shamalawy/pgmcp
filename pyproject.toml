[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pgmcp"
version = "0.1.0"
description = "A fully featured Model Context Protocol server for PostgreSQL: introspection, safe querying, performance analysis and guarded writes."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "shereif", email = "hamalawy@gmail.com" }]
keywords = ["mcp", "postgres", "postgresql", "model-context-protocol", "llm", "ai", "database"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=2.1.1,<3",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlparse>=0.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
pgmcp = "pgmcp.__main__:main"

[project.urls]
Homepage = "https://github.com/shamalawy/pgmcp"
Repository = "https://github.com/shamalawy/pgmcp"
Issues = "https://github.com/shamalawy/pgmcp/issues"
Changelog = "https://github.com/shamalawy/pgmcp/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/pgmcp"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101", "S608", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]

[tool.mypy]
python_version = "3.10"
packages = ["pgmcp"]
strict = false
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires a live PostgreSQL server (PGMCP_TEST_DSN)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/pgmcp"]

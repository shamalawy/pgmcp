name: Feature Request
description: Suggest a new feature or improvement
labels: enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe what you'd like to see.
  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: |
        Describe the problem you're trying to solve or the use case.
        Is this related to an existing limitation?
      placeholder: |
        I'm trying to ... but pgmcp currently doesn't support ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: What would you like pgmcp to do?
      placeholder: |
        pgmcp could ...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any other approaches or workarounds?
  - type: textarea
    id: examples
    attributes:
      label: Example Usage
      description: How would you use this feature? Show a concrete example if possible.
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context about this feature request?
